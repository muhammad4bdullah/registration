<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071d15">
    <meta name="description" content="Page not found on AMUN.">
    <title>AMUN | Page Not Found</title>
    <link rel="icon" type="image/png" href="apsacs-logo.png">
    <style>
        :root {
            --bg: #071d15;
            --bg-2: #0d2d21;
            --panel: rgba(12, 31, 22, 0.82);
            --border: rgba(140, 220, 180, 0.18);
            --text: #ecfff4;
            --muted: #bfd9c8;
            --gold: #bfeecf;
            --cyan: #a9f7c8;
            --green: #1ea76b;
            --green-dark: #126d45;
        }

        * { box-sizing: border-box; }
        html { overflow-x: clip; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(30, 167, 107, 0.24), transparent 20%),
                radial-gradient(circle at bottom right, rgba(169, 247, 200, 0.12), transparent 18%),
                linear-gradient(180deg, #05170f 0%, #0a241b 40%, #071d15 100%);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(30, 167, 107, 0.08), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }

        .topbar {
            height: 76px;
            width: 100%;
            flex: 0 0 auto;
            position: relative;
            z-index: 2;
            background: rgba(4, 29, 22, 0.9);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand {
            width: min(1180px, 92%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img { width: 44px; height: 44px; object-fit: contain; }
        .brand strong { display: block; color: var(--text); font-size: 17px; }
        .brand span { display: block; color: var(--muted); font-size: 11px; }

        .page {
            flex: 1;
            width: 100%;
            display: grid;
            place-items: center;
            padding: 48px 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            width: min(760px, 90%);
            padding: 46px 34px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: linear-gradient(150deg, rgba(10, 52, 38, 0.86), rgba(5, 32, 24, 0.91));
            box-shadow: 0 30px 80px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.04);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .card::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -40px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(169,247,200,0.12), transparent 68%);
            pointer-events: none;
        }

        .code {
            font-size: clamp(4rem, 16vw, 9rem);
            letter-spacing: -0.08em;
            color: var(--gold);
            font-weight: 800;
            margin: 0;
            text-shadow: 0 0 30px rgba(191,238,207,0.18);
        }

        h1 {
            margin: 8px 0 12px;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 auto;
            max-width: 560px;
            color: var(--muted);
            font-size: 1.03rem;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(5, 36, 27, 0.82);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease;
        }

        .button:hover { transform: translateY(-1px); }

        .button.primary {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            border-color: transparent;
            box-shadow: 0 14px 26px rgba(20, 102, 69, 0.32);
        }

        .theme-map {
            position: fixed;
            top: 50%;
            right: 0;
            width: min(100vw, 1280px);
            height: auto;
            transform: translateY(-50%);
            opacity: 0.34;
            pointer-events: none;
            z-index: 0;
        }

        .page-footer {
            width: min(900px, 90%);
            flex: 0 0 auto;
            margin: 0 auto 34px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 18px;
            position: relative;
            z-index: 1;
        }

        .page-footer a { color: var(--muted); font-size: 13px; }
        .page-footer a:hover { color: var(--gold); }

        @media (max-width: 600px) {
            .card { padding: 34px 22px; }
            .theme-map { width: 100vw; opacity: 0.18; }
        }
    </style>
</head>
<body>
    <svg class="theme-map" viewBox="0 0 460 345" aria-hidden="true">
        <defs>
            <filter id="not-found-red-map" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix" values="
                    0 0 0 0 0.55
                    0 0 0 0 0.045
                    0 0 0 0 0.08
                    -0.2126 -0.7152 -0.0722 0 1" />
            </filter>
        </defs>
        <image href="world-map.webp" width="460" height="345" filter="url(#not-found-red-map)" />
    </svg>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="Go back to AMUN home">
            <img src="apsacs-logo.png" alt="APSACS Logo">
            <div><strong>AMUN</strong><span>APSACS MODEL UNITED NATIONS</span></div>
        </a>
    </header>
    <main class="page">
        <section class="card" aria-live="polite">
            <p class="code">404</p>
            <h1>Page not found</h1>
            <p>The page you are looking for may have moved, been removed, or never existed. Please head back to the AMUN homepage or open the registration page.</p>
            <div class="actions">
                <a href="index.html" class="button primary">Back to home</a>
                <a href="registration.html" class="button">Open registration</a>
            </div>
        </section>
    </main>
    <footer class="page-footer" aria-label="AMUN quick links">
        <a href="index.html">Home</a>
        <a href="registration.html">Register</a>
        <a href="support.html">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms.html">Terms &amp; Conditions</a>
    </footer>
</body>
</html>
